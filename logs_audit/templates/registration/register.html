<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - LogAuditProject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .auth-card { max-width: 450px; margin: 80px auto; }
        .form-text { font-size: 0.8rem; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h5 class="mb-0">注册新账号</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" id="{{ field.id_for_label }}" required>
                        {% if field.help_text %}
                        <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100">立即注册</button>
                </form>
            </div>
            <div class="card-footer text-center text-muted small">
                已有账号？<a href="{% url 'login' %}" class="text-decoration-none">返回登录</a>
            </div>
        </div>
    </div>
</body>
</html>
